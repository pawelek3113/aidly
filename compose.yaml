name: aidly

services:
  db:
    container_name: aidly-db
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidly_db}

    ports:
      - ${POSTGRES_PORT:-5432}:5432

    volumes:
      - aidly-db-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DATABASE_URL}"]
      interval: 15s
      timeout: 5s
      retries: 5

  db-test:
    container_name: aidly-db-test
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_USER: test
      POSTGRES_DB: test

    ports:
      - 5433:5432

    volumes:
      - aidly-db-data-test:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DATABASE_URL}"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  aidly-db-data:
  aidly-db-data-test:
